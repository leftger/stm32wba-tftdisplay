[package]
name = "stm32wba-tftdisplay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stm32wba-tftdisplay"
path = "src/main.rs"

[[bin]]
name = "doom_demo"
path = "src/bin/doom_demo.rs"


[dependencies]
embassy-stm32 = { path = "../../embassy-project/embassy/embassy-stm32", features = ["stm32wba65ri", "memory-x", "time-driver-any", "usb-host", "exti"] }
embassy-executor = { path = "../../embassy-project/embassy/embassy-executor", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { path = "../../embassy-project/embassy/embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb-host = { path = "../../embassy-project/embassy/embassy-usb-host", features = ["defmt"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "0.3.10"
defmt-rtt = "0.4.1"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
icm20948-rs = "0.2"
embedded-graphics = "0.8.1"
embedded-graphics-core = "0.4.0"
display-interface = "0.5.0"
display-interface-spi = "0.5.0"
mipidsi = "0.9.0"

embedded-3dgfx = { git = "https://github.com/leftger/embedded-3dgfx", branch = "master", default-features = false, features = ["row_width_320", "depth-u16", "physics"] }
nalgebra = { version = "0.34", default-features = false, features = ["libm"] }
libm = "0.2.11"

[build-dependencies]
cortex-m-rt = "0.7.5"

[profile.dev]
opt-level = 2
debug = true
lto = "thin"

[profile.release]
opt-level = 3
debug = true
lto = true
codegen-units = 1
panic = "abort"
