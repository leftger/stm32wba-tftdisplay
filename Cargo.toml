[package]
name = "stm32wba-tftdisplay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stm32wba-tftdisplay"
path = "src/main.rs"
required-features = ["physics"]

[[bin]]
name = "doom_demo"
path = "src/bin/doom_demo.rs"
required-features = ["doom"]

[[bin]]
name = "orientation_demo"
path = "src/bin/orientation_demo.rs"
required-features = ["lighting"]

[features]
default = []
# Forwarded embedded-3dgfx 0.5 feature gates (slim engine default is MCU-oriented).
lighting = ["embedded-3dgfx/lighting"]
physics = ["embedded-3dgfx/physics"]
raycast = ["embedded-3dgfx/raycast"]
hud = ["embedded-3dgfx/hud"]
textured = ["embedded-3dgfx/textured"]
# Convenience bundle for the Doom raycast demo.
doom = ["lighting", "textured", "raycast", "hud"]

[dependencies]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["stm32wba65ri", "memory-x", "time-driver-any", "usb-host", "exti"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb-host = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["defmt"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "0.3.10"
defmt-rtt = "0.4.1"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
icm20948-rs = "0.2"
embedded-graphics = "0.8.1"
embedded-graphics-core = "0.4.0"
display-interface = "0.5.0"
display-interface-spi = "0.5.0"
mipidsi = "0.9.0"

# 0.5 slim features: pick bin features (`lighting` / `physics` / `doom`) explicitly.
embedded-3dgfx = { git = "https://github.com/leftger/embedded-3dgfx", branch = "master", default-features = false, features = ["row_width_320", "depth-u16"] }
# Match embedded-3dgfx 0.5 (nalgebra 0.35). uf-ahrs uses the same major.
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }
libm = "0.2.11"
uf-ahrs = "0.2.1"

[build-dependencies]
cortex-m-rt = "0.7.5"

[profile.dev]
opt-level = 2
debug = true
lto = "thin"

[profile.release]
opt-level = 3
debug = true
lto = true
codegen-units = 1
panic = "abort"
